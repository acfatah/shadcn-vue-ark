name: Registry

on:
  push:
    branches: [main]
    paths:
      - packages/registry/src/**
      - packages/registry/registry.json
      - registry.json
      - .github/workflows/registry.yml
  pull_request:
    paths:
      - packages/registry/src/**
      - packages/registry/registry.json
      - registry.json
      - .github/workflows/registry.yml

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild registry
        run: cd packages/registry && bun registry build

      # Fail if the committed registry.json drifts from a fresh build.
      - name: Check registry.json is up to date
        run: git diff --exit-code -- packages/registry/registry.json

      # GitHub-address registries require shadcn >= 4.x.
      - name: Validate registry
        run: bunx --bun shadcn@4 registry validate registry.json
