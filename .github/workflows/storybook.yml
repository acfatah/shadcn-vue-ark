name: Storybook

on:
  push:
    branches: [main]
    paths:
      - packages/registry/stories/**
      - packages/registry/.storybook/**
      - packages/registry/src/**
      - packages/registry/vitest.config.ts
      - packages/registry/vite.config.ts
      - packages/registry/package.json
      - .github/workflows/storybook.yml
  pull_request:
    paths:
      - packages/registry/stories/**
      - packages/registry/.storybook/**
      - packages/registry/src/**
      - packages/registry/vitest.config.ts
      - packages/registry/vite.config.ts
      - packages/registry/package.json
      - .github/workflows/storybook.yml

jobs:
  stories:
    name: Story tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/registry
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      # Unit project: existing tests + the story-shape and argTypes-drift
      # guards (report-only for non-conformant components, blocking for those
      # in stories/__checks__/conformant.ts).
      - name: Unit + story-contract checks
        run: bun run test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Storybook project (Vitest browser mode): every story export renders,
      # every play() passes, and a11y runs. Stories at a11y.test 'todo' report
      # only; components promoted to 'error' fail on any violation.
      - name: Story tests (render + play + a11y)
        run: bun run test:stories

      # Full catalog compiles: docgen, ?raw sources, Tailwind, autodocs.
      - name: Build Storybook
        run: bun run storybook:build

  additive-guard:
    name: Story work is additive
    # Only enforced on PRs labelled `story-effort`, so normal component PRs are
    # never blocked. Story-effort PRs must not touch component source.
    if: >-
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'story-effort')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject edits to component source
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if git diff --name-only "$base"...HEAD \
            -- 'packages/registry/src/components/**' | grep -q .; then
            echo 'Story-effort PRs must not modify packages/registry/src/components.'
            echo 'Log the defect in docs/story-defect-log.md instead (file, do not fix).'
            git diff --name-only "$base"...HEAD -- 'packages/registry/src/components/**'
            exit 1
          fi

  new-component-story:
    name: New component needs a story
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every new ui component ships a story dir
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD \
            -- 'packages/registry/src/components/ui/*/_registry.ts' \
            | sed -E 's#.*/ui/([^/]+)/_registry.ts#\1#' | sort -u)
          fail=0
          for c in $added; do
            if ! ls "packages/registry/stories/components/ui/$c/"*.stories.* \
              >/dev/null 2>&1; then
              echo "New component '$c' has no story under stories/components/ui/$c/"
              fail=1
            fi
          done
          exit $fail
